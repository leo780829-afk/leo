*{box-sizing:border-box}

header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:14px 20px}

#views button,#auto{font:inherit;font-size:12px;color:#cfe0ff;background:rgba(10,14,32,.78);border:1px solid #34406a;border-radius:99px;padding:5px 12px;cursor:pointer}
#views button.on,#auto.on{border-color:#6fe0ff;color:#fff;box-shadow:0 0 10px #6fe0ff66}
#auto{position:absolute;right:12px;top:12px}
#hint{position:absolute;left:12px;bottom:10px;font-size:12px;color:#8fa0d0;background:rgba(6,8,20,.6);padding:4px 10px;border-radius:8px;pointer-events:none}

#panel.on{display:block}
#panel h3{margin:0 0 2px;font-size:18px}#panel .r{font-size:13px;color:#9fb0e0;margin-bottom:8px}
#p-state{display:inline-block;padding:2px 10px;border-radius:99px;color:#04101a;font-weight:700;font-size:13px}
#panel dl{margin:10px 0 0;font-size:13px;line-height:1.55}#panel dt{color:#7f92c8;margin-top:6px}#panel dd{margin:0;color:#eef2ff}
#panel .btns{margin-top:10px;display:flex;gap:8px}#panel button{font:inherit;font-size:12px;color:#cfe0ff;background:#101a3a;border:1px solid #34406a;border-radius:8px;padding:5px 12px;cursor:pointer}
#nogl{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#0a0c1c;color:#cfd8ff;font-size:15px;text-align:center;padding:20px}
section{padding:18px 20px}
section h2{margin:0 0 10px;font-size:16px;color:#cfe0ff}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:#8fa0d0;font-weight:500;padding:8px 10px;border-bottom:1px solid #263060;white-space:nowrap}

#tbl tr{cursor:pointer}#tbl tr:hover,#tbl tr.sel{background:#101838}
.st{display:inline-block;padding:2px 10px;border-radius:99px;color:#04101a;font-weight:700;font-size:12px;white-space:nowrap}
.note{font-size:12px;color:#7f92c8;margin-top:8px;line-height:1.6}
