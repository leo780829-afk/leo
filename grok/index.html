<style>
:root{
  --bg:#07060e;
  --pink:#ff4fd8;
  --cyan:#7ee8ff;
  --gold:#ffc56d;
  --ink:#eef3ff;
  --dim:#b7c3e4;
  --line:rgba(160,190,255,.28);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"WenQuanYi Micro Hei","Microsoft JhengHei","PingFang TC","Noto Sans CJK TC",sans-serif;
  overflow:hidden;touch-action:none}
button,input{font:inherit;color:inherit;touch-action:manipulation}
button{cursor:pointer}
#app{position:fixed;inset:0}
#view{display:block;width:100%;height:100%;background:
  radial-gradient(1200px 500px at 50% 18%, #17122c 0%, #07060e 62%)}
#hud{position:absolute;left:0;right:0;top:0;z-index:3;pointer-events:none;
  padding:calc(8px + env(safe-area-inset-top)) 12px 22px;
  background:linear-gradient(to bottom, rgba(6,6,14,.92), rgba(6,6,14,.55) 68%, transparent)}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.brand h1{margin:0;font-size:18px;letter-spacing:.04em;
  background:linear-gradient(90deg,#ff8ae2,#fff 42%,#8aefff);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.asof{margin:2px 0 0;font-size:12px;color:var(--dim)}
.asof b{color:#fff;font-weight:700}
.top-actions{display:flex;gap:6px;align-items:center;pointer-events:auto}
.pill,.zones button,#refresh,#open-routines,.zoom button,#card .x,#routines .x{
  border:1px solid var(--line);background:rgba(10,12,24,.78);border-radius:999px}
.pill{padding:4px 10px;font-size:12px;color:var(--cyan)}
.pill.bad{color:#ffb4c4;border-color:rgba(255,120,150,.45)}
.pill.ok{color:#b9ffd9;border-color:rgba(80,255,170,.35)}
#refresh{padding:4px 10px;font-size:12px}
#refresh.busy{opacity:.6}
.zones{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;pointer-events:auto}
.zones button{padding:6px 10px;font-size:13px;min-height:36px;flex:none;white-space:nowrap}
.zones,#legend{touch-action:pan-x}
.zones button.on{border-color:#ffc56d;color:#fff8ea;box-shadow:0 0 0 1px rgba(255,197,109,.35),0 0 16px rgba(255,140,220,.25)}
#legend{display:flex;gap:8px;overflow:auto;margin-top:8px;pointer-events:auto;scrollbar-width:none}
#legend::-webkit-scrollbar{display:none}
#legend span{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#d5def6}
#legend i{width:9px;height:9px;border-radius:50%;display:block;box-shadow:0 0 8px currentColor}
#hint{position:absolute;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);
  z-index:3;margin:0;padding:6px 12px;border-radius:999px;background:rgba(8,10,20,.72);
  border:1px solid var(--line);color:#d5def8;font-size:12px;pointer-events:none;white-space:nowrap;
  max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis;transition:opacity .6s}
#hint.hide{opacity:0}
.zoom{position:absolute;left:12px;top:46%;z-index:4;display:flex;flex-direction:column;gap:8px}
.zoom button{width:44px;height:44px;font-size:22px;line-height:1}
#open-routines{position:absolute;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:4;
  min-height:44px;padding:8px 14px;font-size:14px}
body.card-open #open-routines,body.rout-open #hint{display:none}
#card,#routines{position:absolute;z-index:5;background:rgba(10,12,22,.94);
  border:1px solid rgba(150,180,255,.32);border-radius:18px;
  box-shadow:0 16px 50px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.03);
  backdrop-filter:blur(8px)}
#card{left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));
  max-height:min(48vh,520px);overflow:auto;padding:14px 14px 12px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
#card .who{display:grid;grid-template-columns:72px 1fr auto;gap:10px;align-items:center}
#portrait{width:72px;height:82px;border-radius:14px;background:
  radial-gradient(circle at 50% 30%, #2a2148, #12121c 70%);display:block}
#card h2{margin:0;font-size:18px}
#card .role{margin:2px 0 0;color:var(--dim);font-size:13px}
#card .x,#routines .x{width:36px;height:36px;border-radius:12px;font-size:18px}
.lamp{display:inline-flex;align-items:center;gap:6px;margin:10px 0 4px;padding:3px 10px;border-radius:999px;
  font-size:13px;font-weight:700;color:#1a1020}
#card h3{margin:10px 0 4px;font-size:13px;color:#9eb0da;font-weight:600}
#c-screen{margin:0;line-height:1.55;font-size:15px}
#card dl{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px}
#card dt{color:#8ea0cc}#card dd{margin:0}
#routines{left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));
  max-height:min(62vh,640px);overflow:auto;padding:14px 14px 8px;touch-action:pan-y}
#routines header{display:flex;justify-content:space-between;align-items:center;gap:8px}
#routines h2{margin:0;font-size:16px}
#routine-list{list-style:none;margin:8px 0 0;padding:0}
#routine-list li{padding:10px 0;border-top:1px solid rgba(255,255,255,.06);
  display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:baseline}
#routine-list b{color:var(--gold);font-size:13px}
#routine-list strong{font-size:14px}
#routine-list p{grid-column:1/-1;margin:0;color:#c9d4ef;font-size:13px;line-height:1.5}
#routine-list em{font-style:normal;font-size:12px;border-radius:99px;padding:2px 8px;background:#2a3148}
#routine-list em[data-k="wait"]{background:#3a2e18;color:#ffd59a}
#routine-list em[data-k="unk"]{background:#2c3140;color:#c5cbe0}
#routine-list em[data-k="go"]{background:#143228;color:#b8ffd8}
#routine-list em[data-k="ok"]{background:#143228;color:#b8ffd8}
.note{font-size:12px;color:#8ea0cc;margin-top:6px}
#err{position:absolute;left:12px;right:12px;top:40%;z-index:6;padding:12px;border-radius:12px;background:#3a1420;color:#fff}
@media (min-width:860px){
  .brand h1{font-size:22px}
  #card{left:auto;top:108px;bottom:16px;right:16px;width:380px;max-height:none}
  #routines{left:16px;right:auto;width:400px;top:auto}
  #open-routines{right:auto;left:16px}
  body.card-open #open-routines{display:inline-block}
}
@media (max-width:859px){
  #hud{padding-bottom:8px}
  .brand h1{font-size:16px}
  .asof{font-size:11px}
  .zones{flex-wrap:nowrap;overflow:auto;scrollbar-width:none}
  .zones::-webkit-scrollbar{display:none}
  #legend{margin-top:4px}
  #hint{bottom:calc(62px + env(safe-area-inset-bottom));font-size:11px}
  .zoom{top:auto;bottom:calc(12px + env(safe-area-inset-bottom));flex-direction:row;left:auto;right:12px}
  #open-routines{left:12px;right:auto}
  body.card-open .zoom, body.rout-open .zoom{visibility:hidden}
}
</style>

    <h3>螢幕內容</h3>
    <p id="c-screen"></p>
    <dl>
      <dt>更新時間</dt><dd id="c-upd"></dd>
      <dt>依據</dt><dd id="c-basis"></dd>
      <dt>資料時間</dt><dd id="c-asof"></dd>
    </dl>
  </aside>
  <aside id="routines" hidden>
    <header>
      <h2>今日排程</h2>
      <button class="x" type="button" id="rout-x" aria-label="關閉排程">×</button>
    </header>
    <ul id="routine-list"></ul>
    <p class="note">與狀態一併更新。時間未寫明的項目維持原樣。</p>
  </aside>
  <div id="err" hidden></div>
</div>

function hexA(hex, a){
  const n = parseInt(hex.slice(1),16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}
function shade(hex, t){
  const n = parseInt(hex.slice(1),16);
  let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  if(t>=0){r+=(255-r)*t;g+=(255-g)*t;b+=(255-b)*t;}
  else{const k=1+t;r*=k;g*=k;b*=k;}
  return `rgb(${r|0},${g|0},${b|0})`;
}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function proj(x,y,z=0){
  const dist = 4800 - y;
  const s = 3100 / dist;
  return {x: CX + (x-CX)*s, y: 28 + y*0.43 - z*s, s};
}
function roundRect(c,x,y,w,h,r){
  r=Math.max(0,Math.min(r,w/2,h/2));
  c.beginPath();
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);
  c.arcTo(x,y,x+w,y,r);
  c.closePath();
}
function quad(pts, color){
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.28)';
  ctx.lineWidth = 1/cam.zoom;
  ctx.stroke();
}
function drawBox(x,y,z,w,d,h,color){
  if(w<=0||d<=0||h<=0) return;
  const top=shade(color,.2), front=shade(color,-.06), side=shade(color,-.32);
  const P=(px,py,pz)=>proj(px,py,pz);
  const mid=x+w/2;
  if(mid<CX){
    quad([P(x+w,y,z),P(x+w,y+d,z),P(x+w,y+d,z+h),P(x+w,y,z+h)], side);
  }else{
    quad([P(x,y,z),P(x,y+d,z),P(x,y+d,z+h),P(x,y,z+h)], side);
  }
  quad([P(x,y+d,z),P(x+w,y+d,z),P(x+w,y+d,z+h),P(x,y+d,z+h)], front);
  quad([P(x,y,z+h),P(x+w,y,z+h),P(x+w,y+d,z+h),P(x,y+d,z+h)], top);
}
function hexPts(cx,cy,r){
  const pts=[];
  for(let i=0;i<6;i++){
    const a=i*Math.PI/3;
    pts.push([cx+Math.cos(a)*r, cy+Math.sin(a)*r*0.9]);
  }
  return pts;
}
function drawPrism(pts,z,h,color){
  const cy=pts.reduce((s,p)=>s+p[1],0)/pts.length;
  const cx=pts.reduce((s,p)=>s+p[0],0)/pts.length;
  const faces=[];
  for(let i=0;i<pts.length;i++){
    const a=pts[i], b=pts[(i+1)%pts.length];
    const midY=(a[1]+b[1])/2;
    if(midY>=cy-2) faces.push({a,b,midY,midX:(a[0]+b[0])/2});
  }
  faces.sort((u,v)=>u.midY-v.midY);
  for(const f of faces){
    const col = f.midX<cx ? shade(color,-.34) : shade(color,-.18);
    quad([proj(f.a[0],f.a[1],z),proj(f.b[0],f.b[1],z),proj(f.b[0],f.b[1],z+h),proj(f.a[0],f.a[1],z+h)], col);
  }
  quad(pts.map(p=>proj(p[0],p[1],z+h)), shade(color,.14));
  ctx.beginPath();
  pts.forEach((p,i)=>{const q=proj(p[0],p[1],z+h+0.4); if(i) ctx.lineTo(q.x,q.y); else ctx.moveTo(q.x,q.y);});
  ctx.closePath();
  ctx.strokeStyle = hexA('#ffc56d',.9);
  ctx.lineWidth = 2.4/cam.zoom;
  ctx.stroke();
}
function pool(x,y,z,radius,color,alpha){
  const p=proj(x,y,z), r=radius*p.s;
  const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r);
  g.addColorStop(0, hexA(color,alpha));
  g.addColorStop(1, hexA(color,0));
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.ellipse(p.x,p.y,r,r*0.42,0,0,7);
  ctx.fill();
}
function neon(text,x,y,size,color,align){
  ctx.save();
  ctx.font=`700 ${size}px ${FONT}`;
  ctx.textAlign=align||'center';
  ctx.textBaseline='middle';
  ctx.lineJoin='round';
  ctx.miterLimit=2;
  ctx.strokeStyle=hexA(color,.45);
  ctx.lineWidth=Math.max(1/cam.zoom, size*0.28);
  ctx.strokeText(text,x,y);
  ctx.fillStyle='#fffaf6';
  ctx.fillText(text,x,y);
  ctx.restore();
}
function vsign(x,y,zTop,text,size,color){
  const chars=Array.from(text);
  chars.forEach((ch,i)=>{
    const p=proj(x,y,zTop-i*size*1.18);
    neon(ch,p.x,p.y,size*p.s,color);
  });
}
function strokePts(pts,color,width){
  const path=new Path2D();
  pts.forEach((pt,i)=>{
    const p=proj(pt[0],pt[1],pt[2]||0);
    if(i) path.lineTo(p.x,p.y); else path.moveTo(p.x,p.y);
  });
  ctx.save();
  ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.strokeStyle=hexA(color,.22);
  ctx.lineWidth=width*3.2;
  ctx.stroke(path);
  ctx.strokeStyle=color;
  ctx.lineWidth=width;
  ctx.stroke(path);
  ctx.restore();
}

function drawCity(t){
  const y=WORLD.y0+2;
  const tl=proj(70,y,WORLD.wall-18), br=proj(WORLD.x1-34,y,64);
  const W=br.x-tl.x, H=br.y-tl.y;
  ctx.save();
  ctx.beginPath(); ctx.rect(tl.x,tl.y,W,H); ctx.clip();
  const sky=ctx.createLinearGradient(0,tl.y,0,br.y);
  sky.addColorStop(0,'#10163a');
  sky.addColorStop(.45,'#241238');
  sky.addColorStop(1,'#070812');
  ctx.fillStyle=sky; ctx.fillRect(tl.x,tl.y,W,H);
  // moon — clear night, no rain
  ctx.fillStyle='rgba(255,246,230,.95)';
  ctx.beginPath(); ctx.arc(tl.x+W*.78, tl.y+H*.16, Math.min(W,H)*.035, 0, 7); ctx.fill();
  ctx.fillStyle='rgba(255,220,170,.18)';
  ctx.beginPath(); ctx.arc(tl.x+W*.78, tl.y+H*.16, Math.min(W,H)*.07, 0, 7); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.85)';
  for(let i=0;i<28;i++){
    const sx=tl.x+((i*97)%100)/100*W;
    const sy=tl.y+((i*53)%70)/100*H*.55;
    const tw=.35+.65*Math.abs(Math.sin(t/700+i));
    ctx.globalAlpha=tw*.8;
    ctx.fillRect(sx,sy,1.4/cam.zoom,1.4/cam.zoom);
  }
  ctx.globalAlpha=1;
  for(const b of SKYLINE){
    const bx=tl.x+b.x*W, bw=b.w*W, bh=b.h*H*.92, by=br.y-bh;
    ctx.fillStyle=b.c;
    ctx.fillRect(bx,by,bw,bh);
    if(b.crown){
      ctx.fillStyle=b.crown;
      ctx.fillRect(bx+bw*.2, by-6/cam.zoom, bw*.6, 5/cam.zoom);
    }
    if(b.spire){
      ctx.fillStyle='#d7e6ff';
      ctx.fillRect(bx+bw*.48, by-H*.08, Math.max(1,bw*.04), H*.08);
    }
    const stepX=Math.max(4/cam.zoom, bw/7);
    const stepY=Math.max(5/cam.zoom, bh/12);
    for(let wy=by+4; wy<br.y-4; wy+=stepY){
      for(let wx=bx+3; wx<bx+bw-3; wx+=stepX){
        const n=Math.abs(Math.sin(wx*12.1+wy*3.7));
        const flick=Math.sin(t/500+wx*0.02)>0.985;
        ctx.fillStyle = (n>0.38 && !flick) ? b.win : 'rgba(0,0,0,.35)';
        ctx.globalAlpha = n>0.38? .85:.5;
        ctx.fillRect(wx,wy,Math.max(1.2/cam.zoom, stepX*0.42), Math.max(1.6/cam.zoom, stepY*0.45));
      }
    }
    ctx.globalAlpha=1;
  }
  const haze=ctx.createLinearGradient(0,br.y-H*.28,0,br.y);
  haze.addColorStop(0,'rgba(8,6,16,0)');
  haze.addColorStop(1,'rgba(8,6,16,.72)');
  ctx.fillStyle=haze; ctx.fillRect(tl.x, br.y-H*.28, W, H*.28);
  // interior glass sheen, not weather
  const sheen=ctx.createLinearGradient(tl.x,tl.y,br.x,br.y);
  sheen.addColorStop(0,'rgba(255,80,200,.05)');
  sheen.addColorStop(.5,'rgba(255,255,255,0)');
  sheen.addColorStop(1,'rgba(80,220,255,.06)');
  ctx.fillStyle=sheen; ctx.fillRect(tl.x,tl.y,W,H);
  ctx.restore();
  ctx.save();
  ctx.strokeStyle='rgba(8,10,18,.85)';
  ctx.lineWidth=Math.max(2, 7/cam.zoom);
  ctx.strokeRect(tl.x,tl.y,W,H);
  ctx.lineWidth=Math.max(1, 2.2/cam.zoom);
  ctx.strokeStyle='rgba(180,200,255,.18)';
  for(let i=1;i<7;i++){
    const x=tl.x+W*i/7;
    ctx.beginPath(); ctx.moveTo(x,tl.y); ctx.lineTo(x,br.y); ctx.stroke();
  }
  const midY=tl.y+H*0.42;
  ctx.beginPath(); ctx.moveTo(tl.x,midY); ctx.lineTo(br.x,midY); ctx.stroke();
  ctx.restore();
}

function drawWalls(){
  // back wall slab around the window
  const y=WORLD.y0;
  quad([
    proj(WORLD.x0,y,0), proj(WORLD.x1,y,0), proj(WORLD.x1,y,WORLD.wall), proj(WORLD.x0,y,WORLD.wall)
  ], '#100e16');
  // side walls
  quad([
    proj(WORLD.x0,WORLD.y0,0), proj(WORLD.x0,WORLD.y1,0),
    proj(WORLD.x0,WORLD.y1,WORLD.wall*.72), proj(WORLD.x0,WORLD.y0,WORLD.wall)
  ], '#14121c');
  quad([
    proj(WORLD.x1,WORLD.y0,0), proj(WORLD.x1,WORLD.y1,0),
    proj(WORLD.x1,WORLD.y1,WORLD.wall*.72), proj(WORLD.x1,WORLD.y0,WORLD.wall)
  ], '#121018');

}
function hexWall(x,y0,y1,color){
  ctx.save();
  ctx.strokeStyle=hexA(color,.28);
  ctx.lineWidth=1/cam.zoom;
  for(let y=y0; y<y1; y+=54){
    for(let z=70; z<250; z+=48){
      const pts=[];
      for(let i=0;i<6;i++){
        const a=Math.PI/6+i*Math.PI/3;
        pts.push(proj(x, y+Math.cos(a)*22, z+Math.sin(a)*20));
      }
      ctx.beginPath();
      pts.forEach((p,i)=>{if(i) ctx.lineTo(p.x,p.y); else ctx.moveTo(p.x,p.y);});
      ctx.closePath(); ctx.stroke();
    }
  }
  ctx.restore();
}
function drawFloor(){
  const pts=[
    proj(WORLD.x0,WORLD.y0,0), proj(WORLD.x1,WORLD.y0,0),
    proj(WORLD.x1,WORLD.y1,0), proj(WORLD.x0,WORLD.y1,0)
  ];
  quad(pts,'#100f16');
  const step=78;
  for(let y=WORLD.y0; y<WORLD.y1; y+=step){
    for(let x=WORLD.x0; x<WORLD.x1; x+=step){
      const alt=((x/step|0)+(y/step|0))%2;
      quad([
        proj(x,y,0.2), proj(Math.min(WORLD.x1,x+step),y,0.2),
        proj(Math.min(WORLD.x1,x+step), Math.min(WORLD.y1,y+step),0.2),
        proj(x, Math.min(WORLD.y1,y+step),0.2)
      ], alt?'#16151f':'#12111a');
    }
  }
  pool(CX, 260, 2, 520, '#ff4fd8', .05);
  pool(CX-280, 300, 2, 280, '#39e7ff', .045);
  pool(CX+300, 300, 2, 260, '#7d5cff', .04);
  const leds=[
    [[LANE_X,1120],[LANE_X,760],[CX,640]],
    [[LANE_X,800],[430,690]],

    [[1560,730],[1600,1040]]
  ];
  for(const line of leds) strokePts(line,'#ff9a3c', 2.2/cam.zoom);
}

function drawPlant(x,y,z,sc,variant){
  const p=proj(x,y,z);
  ctx.save();

  ctx.fillStyle='#4a3428';
  roundRect(ctx,-10,-8,20,14,3); ctx.fill();
  ctx.fillStyle='#2a1c16';
  ctx.fillRect(-8,-11,16,4);
  if(variant===1){
    for(let i=0;i<5;i++){
      ctx.save(); ctx.rotate(-0.45+i*0.22);
      ctx.fillStyle=i%2?'#1c6e3e':'#2f9a58';
      roundRect(ctx,-3,-52,6,44,2); ctx.fill();
      ctx.restore();
    }
  }else{
    const cols=['#146b3a','#1f8a48','#2ea15a','#187246','#3cba6e','#145c34'];
    for(let i=0;i<6;i++){
      ctx.save();
      ctx.rotate(-1.15+i*0.42);
      ctx.translate(0,-16);
      ctx.fillStyle=cols[i%cols.length];
      ctx.beginPath(); ctx.ellipse(0,-8, variant===2?7:11, 15, 0,0,7); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.14)';
      ctx.beginPath(); ctx.ellipse(-2,-10,3,7,-0.5,0,7); ctx.fill();
      ctx.restore();
    }
  }
  ctx.restore();
}

    ctx.beginPath(); ctx.rect(p.x,p.y,pw,ph); ctx.clip();
    ctx.translate(p.x,p.y);
    const g=ctx.createLinearGradient(0,0,pw,ph);
    g.addColorStop(0,'#0c1c2e'); g.addColorStop(1,'#160e28');
    ctx.fillStyle=g; ctx.fillRect(0,0,pw,ph);
    const title=Math.min(pw*0.045, ph*0.16);
    ctx.fillStyle='#d8f6ff';
    ctx.font=`700 ${title}px ${FONT}`;
    ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.fillText('團隊狀態總覽', 10, 8);
    ctx.fillStyle='#9eb4d4';
    ctx.font=`500 ${title*0.62}px ${FONT}`;
    ctx.textAlign='right';
    ctx.fillText(state.asOf||'', pw-10, 10);
    const list=actors;
    const n=list.length;
    const cols=n<=4?Math.max(1,n):n<=8?4:n===9?3:4;
    const rows=Math.ceil(list.length/cols)||1;
    const top=title+16, gap=6;
    const cw=(pw-16-(cols-1)*gap)/cols;
    const ch=(ph-top-10-(rows-1)*gap)/rows;
    list.forEach((a,i)=>{
      const c=i%cols, r=(i/cols)|0;
      const x=8+c*(cw+gap), y=top+r*(ch+gap);
      ctx.fillStyle=a.id===selectedId?'rgba(255,197,109,.16)':'rgba(255,255,255,.04)';
      roundRect(ctx,x,y,cw,ch,6); ctx.fill();
      ctx.strokeStyle=hexA(LIGHTS[a.light].color,.8);
      ctx.lineWidth=1.5/cam.zoom; ctx.stroke();
      ctx.fillStyle=LIGHTS[a.light].color;
      ctx.beginPath(); ctx.arc(x+10,y+ch*0.38,Math.min(5,ch*0.12),0,7); ctx.fill();
      ctx.fillStyle='#fff';
      ctx.textAlign='left'; ctx.textBaseline='middle';
      const fs=Math.min(cw/7.2, ch*0.34);
      ctx.font=`700 ${fs}px ${FONT}`;
      ctx.fillText(a.short, x+20, y+ch*0.38);
      if(fs*cam.zoom>8 && ch>28){
        ctx.fillStyle='#c5d2ee';
        ctx.font=`500 ${fs*0.72}px ${FONT}`;
        const line=a.screen||'';
        const max=Math.max(4,(cw-16)/(fs*0.72));
        ctx.fillText(Array.from(line).slice(0,max|0).join(''), x+8, y+ch*0.74);
      }
      hotspots.push({x:p.x+x,y:p.y+y,w:cw,h:ch,id:a.id});
    });
    ctx.restore();
  });
}
function drawMonitorPanel(x,y,z,w,h,edge,inner){

function drawWorkstation(a,t){

function drawDeskLamp(x,y,z,a,t){
  const info=LIGHTS[a.light];
  const pulse=a.light==='blocked'?(0.45+0.55*Math.sin(t/80))
    :a.light==='waiting'?(0.55+0.45*Math.sin(t/260))
    :a.light==='idle'?(0.7+0.3*Math.sin(t/420))
    :a.light==='unknown'?0.35:1;
  const b=proj(x,y,z), top=proj(x+6,y+4,z+26);
  ctx.strokeStyle='#2c261f';
  ctx.lineWidth=2/cam.zoom;
  ctx.beginPath(); ctx.moveTo(b.x,b.y); ctx.lineTo(top.x,top.y); ctx.stroke();
  ctx.fillStyle=hexA(info.color,.25*pulse);
  ctx.beginPath(); ctx.arc(top.x,top.y,9*top.s,0,7); ctx.fill();
  ctx.fillStyle=info.color;
  ctx.globalAlpha=pulse;
  ctx.beginPath(); ctx.arc(top.x,top.y,3.4*top.s,0,7); ctx.fill();
  ctx.globalAlpha=1;
  if(a.light==='blocked'){
    const p=proj(x,y,z);
    const rad=(8+((t/40)%18))*p.s;
    ctx.strokeStyle=`rgba(255,77,106,${1-((t/40)%18)/18})`;
    ctx.lineWidth=2/cam.zoom;
    ctx.beginPath(); ctx.ellipse(p.x,p.y,rad,rad*0.45,0,0,7); ctx.stroke();
  }
}
function drawPersonMonitor(a,x,y,z,w,h,kind,main,t){
  const top=proj(x,y,z+h);
  const pw=w*top.s, ph=h*top.s;
  const edge=LIGHTS[a.light].color;
  ctx.fillStyle='#10131c';
  roundRect(ctx, top.x-3, top.y-3, pw+6, ph+8, 4); ctx.fill();
  ctx.lineWidth=(a.light==='blocked'?2.6:1.6)/cam.zoom;
  ctx.strokeStyle=edge;
  ctx.globalAlpha=a.light==='blocked'?(0.55+0.45*Math.sin(t/90)):1;
  ctx.stroke();
  ctx.globalAlpha=1;
  ctx.save();
  ctx.beginPath(); ctx.rect(top.x, top.y, pw, ph); ctx.clip();
  ctx.translate(top.x, top.y);
  if(a.light==='unknown') ctx.globalAlpha=.62;
  drawScreenGraphic(a, kind, pw, main?ph*0.36:ph, t);
  if(main){
    const gh=ph*0.36;
    const target=Math.min((pw-8)/8.6, (ph-gh-4)/4.8);
    if(target*cam.zoom>=7.2){
      ctx.font=`600 ${target}px ${FONT}`;
      ctx.fillStyle=kind==='chart'||kind==='plan'?'#c9ffe0':'#e7f0ff';
      ctx.textAlign='left'; ctx.textBaseline='top';
      const lines=wrapText(ctx, a.screen||'', pw-8);
      const lh=target*1.38;
      const maxLines=Math.max(1, ((ph-gh-4)/lh)|0);
      let start=0, shift=0;
      if(lines.length>maxLines){
        const cycle=(lines.length-maxLines+1);
        const u=(t/1100)%cycle;
        start=u|0;
        shift=(u%1)*lh;
      }
      ctx.save();
      ctx.beginPath(); ctx.rect(0,gh,pw,ph-gh); ctx.clip();
      ctx.translate(4, gh+2-shift);
      const slice=lines.slice(start, start+maxLines+1);
      slice.forEach((ln,i)=>{
        ctx.fillText(ln,0,i*lh);
      });
      if(a.light==='working'){
        const last=slice[0]||'';
        const blink=Math.sin(t/180)>0;
        if(blink){
          const tw=ctx.measureText(slice[Math.min(slice.length-1,0)]||'').width;
          ctx.fillRect(4+ (slice.length?ctx.measureText(slice[0]).width:0), 2, Math.max(4,target*0.45), lh*0.7);
        }
      }
      ctx.restore();
    }
  }
  // glass
  const glare=ctx.createLinearGradient(0,0,pw,ph);
  glare.addColorStop(0,'rgba(255,255,255,.16)');
  glare.addColorStop(.35,'rgba(255,255,255,0)');
  ctx.fillStyle=glare; ctx.fillRect(0,0,pw,ph*0.5);
  ctx.restore();
  if(main) hotspots.push({x:top.x,y:top.y,w:pw,h:ph,id:a.id});
}
function drawScreenGraphic(a,kind,w,h,t){
  if(kind==='chart'||kind==='side'){
    ctx.fillStyle='#07140f'; ctx.fillRect(0,0,w,h);
    const n=Math.max(6,(w/8)|0);
    const cw=w/n;
    for(let i=0;i<n;i++){
      const up=Math.sin(a.seed+i*1.7)>0;
      const bh=h*(0.25+0.5*Math.abs(Math.sin(a.seed*2+i)));
      const base=h*(0.55+0.2*Math.sin(a.seed+i*0.6+t*(a.id==='daytrade'?0.004:0.0012)));
      ctx.fillStyle=up?'#3dff9a':'#ff5d73';
      ctx.fillRect(i*cw+1.2, base-bh*0.5, Math.max(1,cw-2.4), bh);
    }
    return;
  }
  if(kind==='photos'){
    ctx.fillStyle='#140c18'; ctx.fillRect(0,0,w,h);
    const cols=3, rows=2, pad=3;
    const cw=(w-pad*(cols+1))/cols, ch=(h-pad*(rows+1))/rows;
    const colors=['#ff8ab8','#8ad0ff','#ffd27a','#c9a6ff','#7dffa8','#ff9a6a'];
    for(let i=0;i<cols*rows;i++){
      const c=i%cols,r=(i/cols)|0;
      ctx.fillStyle=colors[i%colors.length];
      ctx.fillRect(pad+c*(cw+pad), pad+r*(ch+pad), cw, ch);
    }
    return;
  }
  if(kind==='court'){
    ctx.fillStyle='#147a3e'; ctx.fillRect(0,0,w,h);
    ctx.strokeStyle='rgba(255,255,255,.85)';
    ctx.lineWidth=1.2/cam.zoom;
    ctx.strokeRect(3,3,w-6,h-6);
    ctx.beginPath(); ctx.moveTo(3,h/2); ctx.lineTo(w-3,h/2); ctx.stroke();
    ctx.beginPath(); ctx.arc(w/2,h/2,Math.min(w,h)*0.18,0,7); ctx.stroke();
    return;
  }
  if(kind==='formula'){
    ctx.fillStyle='#101018'; ctx.fillRect(0,0,w,h);
    ctx.strokeStyle='#ffe1a0'; ctx.lineWidth=1.4/cam.zoom;
    ctx.beginPath();
    for(let i=0;i<=24;i++){
      const x=4+i*(w-8)/24;
      const y=h*0.7 - Math.sin(i*0.45+a.seed)*h*0.28;
      if(i) ctx.lineTo(x,y); else ctx.moveTo(x,y);
    }
    ctx.stroke();
    return;
  }
  if(kind==='plan'){
    ctx.fillStyle='#0d1420'; ctx.fillRect(0,0,w,h);
    for(let i=0;i<4;i++){
      const y=6+i*(h/4.4);
      ctx.strokeStyle='#9fd0ff'; ctx.strokeRect(4,y,h*0.22,h*0.22);
      if(i<2){ctx.fillStyle='#3dff9a'; ctx.fillRect(5,y+2,h*0.16,h*0.12);}
      ctx.fillStyle='#d5e4ff';
      ctx.fillRect(h*0.4, y+2, w*0.6, Math.max(2,h*0.08));
    }
    return;
  }
  if(kind==='clock'){
    ctx.fillStyle='#0c1422'; ctx.fillRect(0,0,w,h);
    ctx.fillStyle='#9fd7ff';
    ctx.font=`700 ${h*0.42}px ${FONT}`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('12:00', w/2, h*0.5);
    return;
  }
  if(kind==='code'){
    ctx.fillStyle='#0b1020'; ctx.fillRect(0,0,w,h);
    ctx.fillStyle='#9bdcff';
    ctx.font=`600 ${Math.max(8/cam.zoom,h/6)}px ui-monospace,monospace`;
    ctx.textAlign='left'; ctx.textBaseline='top';
    ['cov>=.95','run(V5)','else gap','months[]'].forEach((ln,i)=>ctx.fillText(ln,3,2+i*(h/4.3)));
    return;
  }
  ctx.fillStyle='#12141c'; ctx.fillRect(0,0,w,h);
  ctx.fillStyle='#c9d4ee';
  for(let i=0;i<3;i++) ctx.fillRect(4, 6+i*(h/3.5), w*(0.5+0.3*((i*3)%2)), Math.max(2,h*0.08));
}
function wrapText(c, text, maxW){
  const lines=[]; let line='';
  for(const ch of Array.from(text)){
    const t=line+ch;
    if(c.measureText(t).width>maxW && line){lines.push(line); line=ch;}
    else line=t;
  }
  if(line) lines.push(line);
  return lines.length?lines:[''];
}

function poseOf(a){
  if(a.mode==='walk') return 'walk';
  if(a.mode==='coffee') return 'coffee';
  if(a.light==='working') return 'type';
  if(a.light==='waiting') return 'wait';

  if(a.light==='unknown') return 'dim';

function drawChibi(a,t,opt){
  const look=a.look;
  const pose=poseOf(a);
  const blink=Math.abs(Math.sin(t/1000*0.55+a.seed))>0.97;
  ctx.save();
  if(pose==='dim') ctx.globalAlpha=.78;
  if(pose==='alert') ctx.translate(Math.sin(t/40)*1.5, 0);
  const bobAmp=pose==='type'?1.1:pose==='walk'?2.4:pose==='dim'?0.3:1.6;
  const bobSp=pose==='type'?9:pose==='walk'?8:2.2;
  if(!reduceMotion) ctx.translate(0, Math.sin(t/1000*bobSp+a.seed)*bobAmp);
  const lean=(a.face||1)*1.4;
  ctx.translate(lean,0);

  if(pose==='walk'||pose==='coffee'){
    const sw=pose==='walk'?Math.sin(t/80+a.seed)*6:0;
    ctx.strokeStyle=look.pants; ctx.lineWidth=5; ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(-4,-20); ctx.lineTo(-4-sw,-1);
    ctx.moveTo(4,-20); ctx.lineTo(4+sw,-1);
    ctx.stroke();
    ctx.strokeStyle='#141820'; ctx.lineWidth=3.5;
    ctx.beginPath();
    ctx.moveTo(-4-sw,-1); ctx.lineTo(-4-sw-4,-1);
    ctx.moveTo(4+sw,-1); ctx.lineTo(4+sw+4,-1);
    ctx.stroke();
  }

  // torso
  ctx.fillStyle=look.outfit;
  ctx.strokeStyle='#1a1216'; ctx.lineWidth=1.6;
  roundRect(ctx,-11,-40,22,22,7); ctx.fill(); ctx.stroke();
  if(look.tie){
    ctx.fillStyle=look.tie;
    ctx.beginPath(); ctx.moveTo(0,-38); ctx.lineTo(3,-28); ctx.lineTo(0,-26); ctx.lineTo(-3,-28); ctx.fill();
  }
  if(look.item==='band'){
    ctx.fillStyle=look.accent;
    ctx.fillRect(-11,-30,22,4);
  }
  ctx.fillStyle=look.accent;
  ctx.fillRect(-3,-38,6,3);

  // arms
  const swing=pose==='type'?Math.sin(t/70):pose==='walk'?Math.sin(t/80+1):Math.sin(t/500)*0.4;
  ctx.strokeStyle=look.outfit; ctx.lineWidth=5; ctx.lineCap='round';
  ctx.beginPath();
  if(pose==='type'){
    ctx.moveTo(-9,-32); ctx.lineTo(-12,-18); ctx.lineTo(-4+swing*4,-6);
    ctx.moveTo(9,-32); ctx.lineTo(12,-18); ctx.lineTo(5-swing*4,-6);
  }else if(pose==='wait'){
    ctx.moveTo(-9,-32); ctx.lineTo(-3,-20);
    ctx.moveTo(9,-32); ctx.lineTo(3,-20);
  }else if(pose==='alert'){
    ctx.moveTo(-9,-32); ctx.lineTo(-16,-48);
    ctx.moveTo(9,-32); ctx.lineTo(16,-48);
  }else if(pose==='coffee'){
    ctx.moveTo(-9,-32); ctx.lineTo(-12,-18);
    ctx.moveTo(9,-32); ctx.lineTo(16,-24);
  }else{
    ctx.moveTo(-9,-32); ctx.lineTo(-14,-18+swing*3);
    ctx.moveTo(9,-32); ctx.lineTo(14,-18-swing*3);
  }
  ctx.stroke();
  ctx.fillStyle=look.skin;
  if(pose==='type'){
    ctx.beginPath(); ctx.arc(-4+swing*4,-6,3.1,0,7); ctx.arc(5-swing*4,-6,3.1,0,7); ctx.fill();
  }else if(pose==='coffee'){
    ctx.beginPath(); ctx.arc(16,-24,3,0,7); ctx.fill();
    ctx.fillStyle='#f6f1e8'; roundRect(ctx,12,-30,9,10,2); ctx.fill();
    ctx.fillStyle='#6a3a28'; ctx.fillRect(13,-29,7,3);
  }else if(pose==='alert'){
    ctx.beginPath(); ctx.arc(-16,-48,3,0,7); ctx.arc(16,-48,3,0,7); ctx.fill();
  }

  // hair back
  drawHairBack(look);
  // head
  ctx.fillStyle=look.skin;
  ctx.beginPath(); ctx.arc(0,-54,16,0,7); ctx.fill();
  ctx.strokeStyle='#2a1a16'; ctx.lineWidth=1.7; ctx.stroke();
  if(look.aged){
    ctx.strokeStyle='rgba(120,80,60,.35)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(-6,-46); ctx.lineTo(-2,-44); ctx.moveTo(3,-46); ctx.lineTo(7,-44); ctx.stroke();
  }
  drawHairFront(look);
  // face
  const dim=pose==='dim';
  eye(-6.2,-55, blink||dim, dim);
  eye(6.2,-55, blink||dim, dim);
  ctx.strokeStyle='#5a3a38'; ctx.lineWidth=1.3;
  ctx.beginPath();
  if(pose==='wait'){ctx.arc(0,-49,3.2,0.2,0.8*Math.PI);}
  else if(pose==='alert'){ctx.moveTo(-3,-47); ctx.lineTo(3,-47);}
  else ctx.arc(0,-49,3.4,0.15*Math.PI,0.85*Math.PI);
  ctx.stroke();
  if(!dim){
    ctx.fillStyle=hexA(look.blush||'#ff9aa8',.7);
    ctx.beginPath(); ctx.ellipse(-9,-50,3.3,2,0,0,7); ctx.ellipse(9,-50,3.3,2,0,0,7); ctx.fill();
  }
  drawAccessory(look);

  ctx.restore();

  if(opt&&opt.portrait) return;
  if(pose==='wait') drawBubble(t);
  if(pose==='alert'){
    ctx.save();
    ctx.translate(18,-86+Math.sin(t/160)*2);
    ctx.fillStyle='#ff4d6a';
    ctx.beginPath(); ctx.arc(0,0,8,0,7); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font=`800 12px ${FONT}`; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('!',0,1);
    ctx.restore();
  }
}
function eye(x,y,closed,dim){
  if(closed){
    ctx.strokeStyle='#2a1c18'; ctx.lineWidth=1.7;
    ctx.beginPath();
    ctx.moveTo(x-4.2,y); ctx.quadraticCurveTo(x, y+(dim?0.2:2.2), x+4.2, y);
    ctx.stroke();
    return;
  }
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.ellipse(x,y,4.3,5.3,0,0,7); ctx.fill();
  ctx.strokeStyle='#22181a'; ctx.lineWidth=1.15; ctx.stroke();
  ctx.fillStyle='#24181c';
  ctx.beginPath(); ctx.arc(x+0.7,y+0.8,2.35,0,7); ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(x+1.7,y-1.3,1.05,0,7); ctx.fill();
}
function drawHairBack(look){
  ctx.fillStyle=look.hair;
  const s=look.hairStyle;
  if(s==='long'){
    ctx.beginPath(); ctx.ellipse(-14,-38,6,22,0.2,0,7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(14,-36,6,24,-0.2,0,7); ctx.fill();
  }else if(s==='pony'){
    ctx.beginPath(); ctx.ellipse(12,-70,6,10,0.4,0,7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(16,-52,5,12,0.5,0,7); ctx.fill();
  }else if(s==='fluffy'){
    ctx.beginPath(); ctx.arc(-8,-66,9,0,7); ctx.arc(8,-66,9,0,7); ctx.arc(0,-70,9,0,7); ctx.fill();
  }
}
function drawHairFront(look){
  ctx.fillStyle=look.hair;
  const s=look.hairStyle;
  if(s==='spiky'){
    ctx.beginPath();
    ctx.moveTo(-15,-60);
    ctx.lineTo(-11,-78); ctx.lineTo(-4,-62);
    ctx.lineTo(1,-82); ctx.lineTo(6,-62);
    ctx.lineTo(12,-78); ctx.lineTo(15,-60);
    ctx.arc(0,-58,15,0.2,Math.PI-0.2,true);
    ctx.closePath(); ctx.fill();
  }else if(s==='fluffy'){
    ctx.beginPath();
    ctx.arc(-8,-68,8,0,7); ctx.arc(9,-68,8,0,7); ctx.arc(0,-74,9,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(0,-58,16.4,Math.PI,0); ctx.closePath(); ctx.fill();
  }else{
    // Top cap only, so cheeks and eyes stay skin-colored.
    ctx.beginPath(); ctx.arc(0,-58,16.6,Math.PI,0); ctx.closePath(); ctx.fill();
  }
  if(s==='bob'||s==='soft'||s==='long'||s==='pony'||s==='side'){
    ctx.beginPath(); ctx.ellipse(-16,-50,4.6,11,0.25,0,7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(16,-50,4.6,11,-0.25,0,7); ctx.fill();
  }
  if(s==='long'){
    ctx.beginPath(); ctx.ellipse(-17,-32,4.4,13,0.2,0,7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(17,-30,4.4,14,-0.15,0,7); ctx.fill();
  }
  if(look.streak){
    ctx.fillStyle=look.streak;
    ctx.beginPath();
    ctx.moveTo(2,-74); ctx.lineTo(12,-62); ctx.lineTo(6,-60); ctx.lineTo(0,-70); ctx.fill();
    ctx.fillStyle=look.hair;
  }
  if(s!=='spiky'){
    ctx.beginPath();
    ctx.moveTo(-13,-66);
    ctx.quadraticCurveTo(-6,-60,0,-65);
    ctx.quadraticCurveTo(7,-59,13,-66);
    ctx.quadraticCurveTo(0,-73,-13,-66);
    ctx.fill();
  }
}

function drawActor(a,t){

  ctx.scale(p.s*1.28,p.s*1.28);
  ctx.translate(0,-16);

function drawTag(a,p){

  ctx.fillText(a.short, x+pad*0.7+size*0.55, y+h/2+0.5);

}

}
function makeActor(def,i,generic){
  const d=def.desk;
  const a={
    id:String(def.id),
    short:def.short||def.id,
    name:def.short||def.id,
    role:def.role||'',

    screen:'',

function genericLook(i){
  const hairs=['#8aa0b8','#d0b090','#9a8ad0','#80b0a0'];
  const outfits=['#3a4258','#4a3a48','#2e4a44','#4a4038'];
  return {skin:'#f0d0bc',hair:hairs[i%4],hairStyle:'cap',outfit:outfits[i%4],accent:'#d0d4e0',pants:'#2a2e38',blush:'#e8b0a4'};
}
function genericDef(e,i){
  const col=i%3, row=(i/3)|0;
  return {
    id:String(e.id), short:String(e.name||e.id).slice(0,6), group:'extra', kind:'note',
    look:genericLook(i),

  };
}
function normLight(v){
  const s=String(v||'').toLowerCase().trim();
  return Object.prototype.hasOwnProperty.call(LIGHTS,s)?s:'unknown';
}
function applyEmp(a,e){
  const prev=a.light;
  a.name=e.name||a.name||a.id;
  if(!a.generic) {/* short stays */}
  else a.short=String(a.name).slice(0,6);
  a.role=e.role||a.role||'';
  a.dept=e.dept||a.dept||(a.generic?'未編組':a.dept);
  a.light=normLight(e.light);
  a.screen=e.screen?String(e.screen):'（沒有畫面內容）';
  a.updated=e.updated?String(e.updated):'—';
  a.basis=e.basis?String(e.basis):'—';
  if(a.light==='idle' && prev!=='idle'){
    a.ai.phase='desk'; a.ai.wait=0; a.ai.next=3+ (a.seed%4);
  }
  if(a.light!=='idle' && prev==='idle' && a.mode!=='sit'){
    a.ai.phase='home'; a.ai.path=null;
  }
}
function sync(data){
  state=data||SAMPLE;
  const incoming=new Map();
  for(const e of state.employees||[]){
    if(e&&e.id!=null) incoming.set(String(e.id), e);
  }
  const known=new Set(ROSTER.map(r=>r.id));
  for(const a of actors){
    if(a.generic) continue;
    const e=incoming.get(a.id);
    if(e){applyEmp(a,e); incoming.delete(a.id);}
    else applyEmp(a,{name:a.name,role:a.role,dept:a.dept,light:'unknown',screen:'尚未收到狀態',updated:'—',basis:'狀態檔沒有這位成員'});
  }
  for(const id of known) incoming.delete(id);
  const extras=[...incoming.values()];
  const key=extras.map(e=>String(e.id)).join('|');
  if(key!==genericKey){
    genericKey=key;
    actors=actors.filter(a=>!a.generic);
    extras.forEach((e,i)=>{
      const a=makeActor(genericDef(e,i), 20+i, true);
      applyEmp(a,e);
      actors.push(a);
    });
  }else{
    for(const a of actors) if(a.generic) applyEmp(a, incoming.get(a.id)||{});
  }
  renderChrome();
  if(selectedId){
    const a=actors.find(x=>x.id===selectedId);
    if(a) fillCard(a); else closeCard();
  }
}

function route(from, to, dir){
  const crossY=745, frontY=1064;
  if(dir==='toCoffee'){
    const pts=[{x:from.x,y:from.y,z:from.z}];
    if(from.z>8){
      pts.push({x:from.x,y:from.y+90,z:from.z});
      pts.push({x:from.x,y:crossY,z:0});
    }else pts.push({x:from.x,y:Math.max(from.y,crossY),z:0});
    pts.push({x:LANE_X,y:crossY+16,z:0});
    pts.push({x:LANE_X,y:frontY,z:0});
    pts.push({x:to.x,y:frontY,z:0});
    pts.push({x:to.x,y:to.y,z:0});
    return pts;
  }
  const pts=[
    {x:from.x,y:from.y,z:from.z},
    {x:from.x,y:frontY,z:0},
    {x:LANE_X,y:frontY,z:0},
    {x:LANE_X,y:crossY,z:0},
    {x:to.x,y:crossY,z:0}
  ];
  if(to.z>8){
    pts.push({x:to.x,y:to.y+80,z:0});
    pts.push({x:to.x,y:to.y,z:to.z});
  }else pts.push({x:to.x,y:to.y,z:to.z||0});
  return pts;
}
function tick(a,dt){
  if(reduceMotion){
    const s=seatOf(a);
    a.mode='sit'; a.pos.x=s.x; a.pos.y=s.y; a.pos.z=s.z; return;
  }
  if(a.light!=='idle'){
    const s=seatOf(a);
    if(a.mode!=='sit' || Math.hypot(a.pos.x-s.x,a.pos.y-s.y)>3){
      if(a.ai.phase!=='home'){
        a.ai.path=route(a.pos,s,'toSeat'); a.ai.i=0; a.ai.phase='home'; a.mode='walk';
      }
    }
  }else if(a.mode==='sit' && a.ai.phase==='desk'){
    a.ai.wait+=dt;
    if(a.ai.wait>=a.ai.next){
      const spot=COFFEE_SPOTS[a.coffeeSlot%COFFEE_SPOTS.length];
      a.ai.path=route(seatOf(a), spot, 'toCoffee');
      a.ai.i=0; a.ai.phase='go'; a.mode='walk';
    }
  }else if(a.mode==='coffee'){
    a.ai.wait+=dt;
    if(a.ai.wait>=5.6){
      a.ai.path=route(a.pos, seatOf(a), 'toSeat');
      a.ai.i=0; a.ai.phase='home'; a.mode='walk'; a.ai.wait=0;
    }
  }
  if(a.mode==='walk'){
    if(!a.ai.path){
      const spot=COFFEE_SPOTS[a.coffeeSlot%COFFEE_SPOTS.length];
      const dest=a.ai.phase==='home'?seatOf(a):spot;
      a.ai.path=route(a.pos, dest, a.ai.phase==='home'?'toSeat':'toCoffee');
      a.ai.i=0;
    }
    follow(a,dt);
  }
}
function follow(a,dt){
  const path=a.ai.path;
  let guard=0;
  while(path && guard++<3){
    const tgt=path[a.ai.i];
    if(!tgt){arrive(a); return;}
    const dx=tgt.x-a.pos.x, dy=tgt.y-a.pos.y, dz=(tgt.z||0)-a.pos.z;
    const dist=Math.hypot(dx,dy,dz);
    if(dist<3){a.ai.i++; continue;}
    const step=Math.min(dist, 132*dt);
    a.pos.x+=dx/dist*step; a.pos.y+=dy/dist*step; a.pos.z+=dz/dist*step;
    if(Math.abs(dx)>2) a.face=dx>0?1:-1;
    return;
  }
  if(path && a.ai.i>=path.length) arrive(a);
}
function arrive(a){
  if(a.ai.phase==='go'){
    const spot=COFFEE_SPOTS[a.coffeeSlot%COFFEE_SPOTS.length];
    a.mode='coffee'; a.ai.phase='coffee'; a.ai.wait=0;
    a.pos.x=spot.x; a.pos.y=spot.y; a.pos.z=0;
  }else{
    const s=seatOf(a);
    a.mode='sit'; a.ai.phase='desk'; a.ai.wait=0; a.ai.next=8+(a.seed%5);
    a.pos.x=s.x; a.pos.y=s.y; a.pos.z=s.z; a.face=1;
  }
}

function hudH(){
  const el=document.getElementById('hud');
  return el&&el.offsetHeight?el.offsetHeight:108;
}
function fitCamera(){
  const corners=[
    proj(WORLD.x0,WORLD.y0,WORLD.wall),
    proj(WORLD.x1,WORLD.y0,WORLD.wall),
    proj(WORLD.x0,WORLD.y1,0),
    proj(WORLD.x1,WORLD.y1,0)
  ];
  return cameraForProjected(corners, 0.96);
}
function cameraForProjected(ps, fill){
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  for(const p of ps){
    minX=Math.min(minX,p.x); maxX=Math.max(maxX,p.x);
    minY=Math.min(minY,p.y); maxY=Math.max(maxY,p.y);
  }
  const narrow=canvas.clientWidth<860;
  const top=hudH()+(narrow?4:6), bot=narrow?72:20;
  const vw=canvas.clientWidth, vh=canvas.clientHeight;
  const zoom=clamp(Math.min((vw-24)/(maxX-minX), (vh-top-bot)/(maxY-minY))*fill, 0.25, 4.6);
  const viewCx=vw/2;
  const viewCy=top+(vh-top-bot)/2;
  return {zoom, panX:viewCx-(minX+maxX)/2*zoom, panY:viewCy-(minY+maxY)/2*zoom};
}
const ZONE_PTS={
  mgmt:[[CX-520,60,340],[CX+520,60,340],[CX-230,660,0],[CX+230,660,0]],
  invest:[[40,300,180],[900,300,180],[40,640,0],[900,640,0]],
  content:[[1240,300,200],[2060,300,200],[1240,680,0],[2060,680,0]],
  lounge:[[40,760,120],[2060,760,120],[40,1140,0],[2060,1140,0]]
};
function cameraForZone(name){
  if(name==='all') return fitCamera();
  let pts=ZONE_PTS[name];
  if(canvas.clientWidth<820 && name==='mgmt'){
    pts=[[CX-250,90,210],[CX+250,90,210],[CX-240,650,0],[CX+240,650,0]];
  }
  return cameraForProjected(pts.map(p=>proj(p[0],p[1],p[2]||0)), canvas.clientWidth<820?0.92:0.9);
}
function setCamera(target, animated){
  if(!animated||reduceMotion){
    cam.zoom=target.zoom; cam.panX=target.panX; cam.panY=target.panY; camAnim=null; return;
  }
  camAnim={from:{zoom:cam.zoom,panX:cam.panX,panY:cam.panY}, to:target, t0:performance.now(), dur:520};
}
function markZone(name){
  document.querySelectorAll('#zones button').forEach(b=>b.classList.toggle('on', b.dataset.zone===name));
}
function applyInitial(){
  if(canvas.clientWidth<820){setCamera(cameraForZone('mgmt'), false); markZone('mgmt');}
  else {setCamera(fitCamera(), false); markZone('all');}
}
function screenToProj(sx,sy){return {x:(sx-cam.panX)/cam.zoom, y:(sy-cam.panY)/cam.zoom};}
function zoomAt(sx,sy,nz){
  nz=clamp(nz, 0.28, 4.6);
  const before=screenToProj(sx,sy);
  cam.zoom=nz;
  cam.panX=sx-before.x*cam.zoom;
  cam.panY=sy-before.y*cam.zoom;
}
function hitTest(pt){
  let rectHit=null, rectArea=1e15, circ=null, circD=1e15;
  for(const h of hotspots){
    if(h.w){
      if(pt.x>=h.x&&pt.x<=h.x+h.w&&pt.y>=h.y&&pt.y<=h.y+h.h){
        const area=h.w*h.h;
        if(area<rectArea){rectArea=area; rectHit=h.id;}
      }
    }else if(h.r){
      const d=Math.hypot(pt.x-h.x, pt.y-h.y);
      if(d<=h.r && d<circD){circD=d; circ=h.id;}
    }
  }
  return rectHit||circ;
}

function drawFrame(now){
  hotspots=[];
  const dt=Math.min(0.05, (now-(drawFrame.last||now))/1000);
  drawFrame.last=now;
  if(camAnim){
    const u=Math.min(1,(now-camAnim.t0)/camAnim.dur);
    const e=u<0.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
    cam.zoom=camAnim.from.zoom+(camAnim.to.zoom-camAnim.from.zoom)*e;
    cam.panX=camAnim.from.panX+(camAnim.to.panX-camAnim.from.panX)*e;
    cam.panY=camAnim.from.panY+(camAnim.to.panY-camAnim.from.panY)*e;
    if(u>=1) camAnim=null;
  }
  for(const a of actors) tick(a,dt);

  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#07060e';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.setTransform(dpr*cam.zoom,0,0,dpr*cam.zoom,dpr*cam.panX,dpr*cam.panY);
  ctx.lineJoin='round'; ctx.lineCap='round';

  drawWalls();
  drawCity(now);
  const sign=proj(250, WORLD.y0+6, 312);
  neon('未來已來', sign.x, sign.y, 46*sign.s, '#ff4fd8');
  vsign(78, 240, 330, '專注・洞察・長期主義', 20, '#ffd36a');
  vsign(70, 860, 300, '品味・平衡・影響力', 18, '#ffb0ea');
  vsign(WORLD.x1-70, 250, 320, '專注・節奏・致勝', 20, '#d7b0ff');
  drawRackets(WORLD.x1-120, 430, 210);
  drawBigScreen(now);
  drawFloor();
  neonAtWorld(470, 430, 156, '投資研究部', 32, '#ffc56d');
  neonAtWorld(1540, 440, 150, '內容工作室', 30, '#ffc56d');

  const plat=hexPts(PLAT.cx, PLAT.cy, PLAT.r);
  const drawables=[
    {y:PLAT.cy-PLAT.r, draw:()=>{
      drawPrism(plat, 0, PLAT.h, '#2a241c');
      drawBox(PLAT.cx-70, PLAT.cy+PLAT.r*0.72, 0, 140, 36, PLAT.h*0.55, '#322c24');
      neonAtWorld(PLAT.cx, PLAT.cy+PLAT.r*0.78, PLAT.h*0.35, '管理部', 32, '#ffc56d');
    }},
    {y:900, draw:()=>drawLounge()},
    {y:1000, draw:()=>drawMoss(now)},
    {y:980, draw:()=>drawCoffee(now)}
  ];
  for(const pl of PLANTS){
    drawables.push({y:pl[1], draw:()=>drawPlant(pl[0],pl[1],pl[2],pl[3],pl[4])});
  }
  if(actors.some(a=>a.generic)){
    drawables.push({y:660, draw:()=>neonAtWorld(220,650,90,'臨時席',24,'#d7e6ff')});
  }
  for(const a of actors){
    drawables.push({y:a.seat.y-16, draw:()=>drawChair(a)});
    drawables.push({y:a.desk.y+a.desk.d, draw:()=>drawWorkstation(a,now)});
    drawables.push({y:a.pos.y+0.2, draw:()=>drawActor(a,now)});
  }
  drawables.sort((a,b)=>a.y-b.y);
  for(const d of drawables) d.draw();

  if(DEBUG){
    ctx.save();
    ctx.strokeStyle='rgba(255,0,80,.7)';
    ctx.lineWidth=1/cam.zoom;
    for(const h of hotspots){
      ctx.beginPath();
      if(h.w) ctx.strokeRect(h.x,h.y,h.w,h.h);
      else {ctx.arc(h.x,h.y,h.r,0,7); ctx.stroke();}
    }
    ctx.restore();
  }

  if(!document.getElementById('card').hidden && selectedId){
    const a=actors.find(x=>x.id===selectedId);
    if(a) renderPortrait(a, now);
  }
  if(!drawFrame.ready){
    drawFrame.ready=true;
    document.documentElement.dataset.ready='1';
  }
}
function drawRackets(x,y,z){
  const p=proj(x,y,z);
  ctx.save(); ctx.translate(p.x,p.y); ctx.scale(p.s,p.s);
  ctx.strokeStyle='#e2c6ff'; ctx.lineWidth=3;
  for(const rot of [-0.7,0.7]){
    ctx.save(); ctx.rotate(rot);
    ctx.beginPath(); ctx.ellipse(0,-18,9,12,0,0,7);
    ctx.moveTo(0,-6); ctx.lineTo(0,20); ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

function resize(){
  dpr=Math.min(2, devicePixelRatio||1);
  const w=canvas.clientWidth||1, h=canvas.clientHeight||1;
  canvas.width=Math.max(1,Math.round(w*dpr));
  canvas.height=Math.max(1,Math.round(h*dpr));
  if(!userMoved) applyInitial();
}

const ptrs=new Map();
let drag=null, pinch=null;
function localPoint(e){
  const r=canvas.getBoundingClientRect();
  return {x:e.clientX-r.left, y:e.clientY-r.top};
}
canvas.addEventListener('pointerdown', e=>{
  canvas.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, {x:e.clientX,y:e.clientY,t:performance.now()});
  camAnim=null;
  if(ptrs.size===1){
    const p=localPoint(e);
    drag={x:e.clientX,y:e.clientY,panX:cam.panX,panY:cam.panY,moved:0,lx:p.x,ly:p.y};
  }
});
canvas.addEventListener('pointermove', e=>{
  if(!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, {x:e.clientX,y:e.clientY,t:ptrs.get(e.pointerId).t});
  if(ptrs.size>=2){
    const arr=[...ptrs.values()];
    const dist=Math.hypot(arr[0].x-arr[1].x, arr[0].y-arr[1].y);
    const mid=localPoint({clientX:(arr[0].x+arr[1].x)/2, clientY:(arr[0].y+arr[1].y)/2});
    if(!pinch) pinch={dist, zoom:cam.zoom};
    const nz=pinch.zoom*(dist/pinch.dist);
    zoomAt(mid.x,mid.y,nz);
    userMoved=true; drag=null;
    return;
  }
  if(drag){
    const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    drag.moved=Math.max(drag.moved, Math.hypot(dx,dy));
    cam.panX=drag.panX+dx; cam.panY=drag.panY+dy;
    if(drag.moved>6){userMoved=true; markZone(''); document.getElementById('hint').classList.add('hide');}
  }
});
function endPtr(e){
  const start=ptrs.get(e.pointerId);
  ptrs.delete(e.pointerId);
  if(ptrs.size<2) pinch=null;
  if(drag && start && drag.moved<8 && performance.now()-start.t<450 && ptrs.size===0){
    const hit=hitTest(screenToProj(drag.lx, drag.ly));
    if(hit) openCard(hit); else closeCard();
    document.getElementById('hint').classList.add('hide');
  }
  if(ptrs.size===0) drag=null;
}
canvas.addEventListener('pointerup', endPtr);
canvas.addEventListener('pointercancel', endPtr);
canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  const p=localPoint(e);
  zoomAt(p.x,p.y, cam.zoom*(e.deltaY<0?1.08:0.92));
  userMoved=true;
},{passive:false});
canvas.addEventListener('contextmenu', e=>e.preventDefault());

document.getElementById('zones').addEventListener('click', e=>{
  const btn=e.target.closest('button');
  if(!btn) return;
  userMoved=true;
  markZone(btn.dataset.zone);
  setCamera(cameraForZone(btn.dataset.zone), true);
  document.getElementById('hint').classList.add('hide');
});
document.getElementById('zin').onclick=()=>{userMoved=true; zoomAt(canvas.clientWidth/2, canvas.clientHeight/2, cam.zoom*1.15);};
document.getElementById('zout').onclick=()=>{userMoved=true; zoomAt(canvas.clientWidth/2, canvas.clientHeight/2, cam.zoom/1.15);};
document.getElementById('refresh').onclick=()=>pull();
document.getElementById('open-routines').onclick=()=>openRoutines();
document.getElementById('rout-x').onclick=()=>closeRoutines();
document.getElementById('card-x').onclick=()=>closeCard();
window.addEventListener('keydown', e=>{
  if(e.key==='Escape'){closeCard(); closeRoutines();}
  const step=40;
  if(e.key==='ArrowLeft'){cam.panX+=step; userMoved=true;}
  if(e.key==='ArrowRight'){cam.panX-=step; userMoved=true;}
  if(e.key==='ArrowUp'){cam.panY+=step; userMoved=true;}
  if(e.key==='ArrowDown'){cam.panY-=step; userMoved=true;}
  if(e.key==='+'||e.key==='=') zoomAt(canvas.clientWidth/2,canvas.clientHeight/2,cam.zoom*1.12);
  if(e.key==='-'||e.key==='_') zoomAt(canvas.clientWidth/2,canvas.clientHeight/2,cam.zoom/1.12);
  if(e.key==='0'){userMoved=false; applyInitial();}
});
window.addEventListener('resize', resize);
window.onerror=function(msg){
  const d=document.getElementById('err');
  d.hidden=false;
  d.textContent='畫面發生問題：'+msg;
};

buildActors();
sync(SAMPLE);
resize();
requestAnimationFrame(function loop(now){drawFrame(now); requestAnimationFrame(loop);});
pull();
setInterval(pull, 60000);
setTimeout(()=>document.getElementById('hint').classList.add('hide'), 9000);
</script>
</body>
</html>
